<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Banks Near You</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        h1 {
            text-align: center;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            padding: 10px;
            text-align: left;
            border: 1px solid #ddd;
        }
        th {
            background-color: #f2f2f2;
        }
        tr:nth-child(even) {
            background-color: #f9f9f9;
        }
    </style>
</head>
<body>

<h1>Banks Near Zipcode {{zipcode}}</h1>

<table>
    <thead>
        <tr>
            <th>Bank Name</th>
            <th>Address</th>
            <th>Latitude</th>
            <th>Longitude</th>
        </tr>
    </thead>
    <tbody>
        <!-- Loop through the list of banks -->
        <tr th:each="bank : ${banks}">
            <td th:text="${bank.name}"></td>
            <td th:text="${bank.address}"></td>
            <td th:text="${bank.latitude}"></td>
            <td th:text="${bank.longitude}"></td>
        </tr>
    </tbody>
</table>

</body>
</html>
